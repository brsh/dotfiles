colourful: true

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Extended Campbell Palette — derived from Microsoft Campbell 16    ║
# ║                                                                    ║
# ║  Core 16 (unchanged for structural elements):                      ║
# ║    black   #0c0c0c / #767676    red     #c50f1f / #e74856         ║
# ║    green   #13a10e / #16c60c    yellow  #f19c00 / #f9f1a5         ║
# ║    blue    #0037da / #3b78ff    magenta #881798 / #b4009e         ║
# ║    cyan    #3a96dd / #61d6d6    white   #cccccc / #f2f2f2         ║
# ║                                                                    ║
# ║  Extended (interpolated from Campbell hue families):               ║
# ║    red mid    #d63545    red tint    #f28b95                       ║
# ║    green mid  #15b40f    green tint  #5ad65a                       ║
# ║    yellow mid #f4b841    blue mid    #1f5beb                       ║
# ║    blue tint  #7da6ff    magenta mid #9c2bab                      ║
# ║    mag tint   #d04ecc    cyan mid    #4db5e5                      ║
# ║    cyan tint  #93e5e5    gray mid    #4d4d4d   gray lt  #a0a0a0  ║
# ║                                                                    ║
# ║  Cross-hue blends (for unique file types):                         ║
# ║    teal    #2a9d8f    orange  #e8790c    rose    #d64d8a          ║
# ║    indigo  #5856d6    olive   #8db600    amber   #e6a117          ║
# ║    slate   #6987c9    peach   #e8916d    violet  #7b68ee          ║
# ║    aqua    #47c8b0    coral   #f07e6e    sky     #5fb5e8          ║
# ╚══════════════════════════════════════════════════════════════════════╝

