set -g status-right "[#[fg=${cpb_green_bright}]#(bash -c 'if [ -f /etc/os-release ]; then source /etc/os-release 2>/dev/null; [ -n \"\$ID\" ] && echo \"\${ID^}\"; elif [ -x /usr/bin/lsb_release ]; then out=\$(/usr/bin/lsb_release -si 2>/dev/null) || out=\"\"; [ -n \"\$out\" ] && out=\${out// /}; echo \"\${out^}\"; elif command -v uname >/dev/null 2>&1; then out=\$(uname -o 2>/dev/null) || out=\"\"; [ -n \"\$out\" ] && out=\${out// /}; echo \"\${out^}\"; fi 2>/dev/null')#[default]] #[fg=${cpb_yellow_bright}]%I:%M%p #[fg=${cpb_green_bright}]%a %b %d"


# active window title colors
set -g window-status-format "#[fg=${cpb_white},bg=${cpb_black_bright}]  #I:#W #{?window_zoomed_flag,z , }#[default]"
set -g window-status-current-format "#[fg=${cpb_white_bright},bg=${cpb_red_bright},bold]  #I:#W #{?window_zoomed_flag,z , }#[default]"

# panes
set -g pane-border-style "fg=${cpb_gray_mid}"
set -g pane-active-border-style "fg=${cpb_yellow}"


##### Layouts
#bind-key -n M-n split-window \; select-layout

# Set window notifications 
setw -g monitor-activity on 
set -g visual-activity on

# Messages
set -g message-style "fg=${cpb_black},bg=${cpb_white_bright},align=centre"
set -g message-command-style "fg=${cpb_black},bg=${cpb_white_bright},align=centre"

# Highlight for sessions, windows, other selectors
set -g mode-style "#[fg=${cpb_black}, bg=${cpb_yellow_mid}]" 

