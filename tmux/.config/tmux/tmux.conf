# Gen'd by Copilot for sharing with Kitty/WezTerm
# Philosophy

# Kitty = windows, tabs, scrolling
# tmux = layouts and remote survival
# Kitty sessions only for local-only workflows

#Kitty Keybinding Strategy

#Kitty handles:
# -New tabs
# - New OS windows
# - Navigating tabs/windows
# - Scrollback

#Kitty should not:
# - Split panes (tmux does that)

##### Prefix (ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

#bind-key C-a last-window

##### Keep tmux around if closing a window
set -g detach-on-destroy off

##### Reload source
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

##### "eternal" prefix wait time
set -sg escape-time 0

##### Pane splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
#unbind '"'
#unbind %

##### Pane navigation (hjkl)
#bind h select-pane -L
#bind j select-pane -D
#bind k select-pane -U
#bind l select-pane -R

bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

##### Resize panes with repeatable keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -n M-S-Left resize-pane -L 5
bind -n M-S-Down resize-pane -D 5
bind -n M-S-Up resize-pane -U 5
bind -n M-S-Right resize-pane -R 5

##### No mouse (let terminal scroll)
setw -g mouse off
## toggle mouse
bind-key m set-option -g mouse \; display-message 'Mouse #{?mouse,ON,OFF}'

##### Colors & terminal support
set -g default-terminal "tmux-256color"
set -g terminal-overrides ",*:Tc"
##### Requires tmux 3.2+
#set -sa terminal-features ",xterm-kitty:RGB"
#set -sa terminal-features ",wezterm:RGB"

##### Quality-of-life
set -g history-limit 100000

##### Needed for vim's autoread and shell integration
set -g focus-events on

##### Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

