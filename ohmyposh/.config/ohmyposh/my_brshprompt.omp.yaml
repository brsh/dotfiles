$schema: https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
version: 4
final_space: true
palette:
  black: '#0C0C0C'
  dark-red: '#C50F1F'
  dark-green: '#13A10E'
  dark-yellow: '#C19C00'
  dark-blue: '#0037DA'
  dark-purple: '#881798'
  dark-cyan: '#3A96DD'
  dark-white: '#CCCCCC'
  bright-black: '#767676'
  red: '#E74856'
  green: '#16C60C'
  yellow: '#F9F1A5'
  blue: '#3B78FF'
  purple: '#B4009E'
  cyan: '#61D6D6'
  white: '#F2F2F2'
blocks:
  - alignment: left
    segments:
      - type: text
        style: plain
        template: "\n"
      - foreground: 'p:white'
        options:
          time_format: 'Mon 01/02 3:04:05pm MST'
        style: diamond
        template: '<{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>[</><p:white></> <p:green>{{ .CurrentDate | date "Mon" }}</> <p:yellow>{{ .CurrentDate | date "01/02" }}</> <p:yellow>{{ .CurrentDate | date "3:04:05pm" }}</> <p:green>{{ .CurrentDate | date "MST" }}</><{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>]</>'
        type: time
      - foreground: 'p:white'
        options:
          style: austin
          threshold: 0
        style: diamond
        template: '<{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>[</><p:white></> <p:yellow>{{ .FormattedMs }}s</><{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>]</>'
        type: executiontime
    type: prompt
  - alignment: left
    newline: true
    segments:
      - background: '#000000'
        foreground: 'p:red'
        style: plain
        template: ' ⚡'
        type: root
#      - type: shell
#        style: diamond
#        powerline_symbol: 
#        template: '<{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>[{{- if eq .Name "bash" -}}󱆃 {{- else if eq .Name "zsh" -}}󰬇  {{- else if eq .Name "pwsh" -}} {{- else if eq .Name "PowerShell" -}} {{- else if eq .Name "fish" -}}󰈺 {{- else if eq .Name "cmd" -}} {{- else -}} {{ end -}}</> <p:white>{{ .Shell }}</><{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>]</>'
#        foreground: 'p:white'
      - foreground: 'p:white'
        style: diamond
        template: '<{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>[</><p:white></> <p:white>Subscription</>: <p:green>{{ .Name }}</><{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>]</>'
        type: az
      - foreground: 'p:white'
        style: diamond
        template: >-
          <{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>[</><p:white></> <p:white>Azure Developer CLI Environment</>: <p:green>{{ .DefaultEnvironment  }}</> <p:white>::</> <p:green>{{ .Version }}</><{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>]</>
        type: azd
      - foreground: 'p:white'
        style: diamond
        template: '<{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>[</><p:white></> <p:green>{{ .Profile }}</>{{if .Region}} <p:white>@</><p:green>{{ .Region }}</>{{ end }}<{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>]</>'
        type: aws
      - foreground: 'p:white'
        style: diamond
        template: >-
          <{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>[</>{{- if eq .Type "node" }} {{- else if eq .Type "deno" }} {{- else if eq .Type "jsr" }} {{- else if eq .Type "cargo" }} {{- else if eq .Type "python" }} {{- else if eq .Type "mojo" }}🔥 {{- else if eq .Type "php" }} {{- else if eq .Type "dart" }} {{- else if eq .Type "nuspec" }} {{- else if eq .Type "dotnet" }} {{- else if eq .Type "julia" }} {{- else if eq .Type "powershell" }} {{- else }}<p:white></> {{- end }} {{ if .Error }}<p:red>{{ .Error }}</>{{ else }}{{ if .Name }}<p:white>{{ .Name }}</>{{ end }}{{ if .Version }} <p:green>v{{.Version}}</>{{ end }}{{ end }}<{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>]</>
        type: project
      - foreground: 'p:white'
        style: diamond
        template: '<{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>[<p:white>󱃾</> <p:green>{{.Context}}</>{{if .Namespace}} <p:white>::</> <p:green>{{.Namespace}}</>{{end}}<{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>]</>'
        type: kubectl
    type: prompt
  - alignment: left
    newline: true
    segments:
      - foreground: 'p:green'
        options:
          fetch_status: true
          fetch_upstream_icon: true
        style: plain
        template: >-
          <{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>[<p:white>{{ .UpstreamIcon }} </></>{{ .HEAD }}{{if .BranchStatus }} <p:cyan>{{ .BranchStatus }}</>{{ end }}{{ if
          .Working.Changed }} <p:yellow></> <p:yellow>{{ .Working.String }}</>{{ end }}{{ if and (.Working.Changed)
          (.Staging.Changed) }} <p:white>|</>{{ end }}{{ if .Staging.Changed }} <p:green></> <p:green>{{ .Staging.String }}</>{{ end }}{{ if gt
          .StashCount 0 }} <p:white></> {{ .StashCount }}{{ end }}<{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>]</>
        type: git
    type: prompt
  - alignment: left
    newline: true
    segments:
      - foreground: 'p:green'
        options:
          style: full
          folder_separator_icon: '<p:white>/</>' 
        style: diamond
        template: '<{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>[</><p:white></> {{ .Path }}<{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>]</>'
        type: path
    type: prompt
  - alignment: left
    newline: true
    segments:
      - style: diamond
        template: <{{ if gt .Code 0 }}p:red{{ else }}p:yellow{{ end }}>[#]</>
        type: root
      - style: diamond
        template: '>'
        type: text
    type: prompt
valid_line:
  background: transparent
  template: '> '
error_line:
  background: transparent
  template: '<p:red></> '
secondary_prompt:
  background: transparent
  template: ' '
