# Extended Campbell Palette — Kitty Terminal
#
# Sets the 16 ANSI color slots, background, foreground, cursor, and
# selection colors to the Microsoft Campbell values.
#
# Usage — add to kitty.conf (replaces any existing theme include):
#   include /path/to/theme_definition/campbell.conf
#
# The extended/blend colors are listed in comments below for reference;
# use them by hex value in any kitty option that accepts a color directly
# (e.g. url_color, cursor, selection_background, tab_bar_background, etc.).

# ─── Terminal Background / Foreground ─────────────────────────────────────────

background            #0c0c0c
foreground            #cccccc

# ─── Cursor ───────────────────────────────────────────────────────────────────

cursor                #f2f2f2
cursor_text_color     #0c0c0c

# ─── Selection ────────────────────────────────────────────────────────────────

selection_background  #3b78ff
selection_foreground  #f2f2f2

# ─── URLs ─────────────────────────────────────────────────────────────────────

url_color             #3b78ff

# ─── ANSI Color Slots (0-15) ──────────────────────────────────────────────────

# Normal colors
color0   #0c0c0c    # black
color1   #c50f1f    # red
color2   #13a10e    # green
color3   #f19c00    # yellow
color4   #0037da    # blue
color5   #881798    # magenta
color6   #3a96dd    # cyan
color7   #cccccc    # white

# Bright colors
color8   #767676    # bright black
color9   #e74856    # bright red
color10  #16c60c    # bright green
color11  #f9f1a5    # bright yellow
color12  #3b78ff    # bright blue
color13  #b4009e    # bright magenta
color14  #61d6d6    # bright cyan
color15  #f2f2f2    # bright white

# ─── Extended Palette (reference — use hex values directly in kitty options) ──
#
#   red_mid         #d63545      red_tint        #f28b95
#   green_mid       #15b40f      green_tint      #5ad65a
#   yellow_mid      #f4b841
#   blue_mid        #1f5beb      blue_tint       #7da6ff
#   magenta_mid     #9c2bab      magenta_tint    #d04ecc
#   cyan_mid        #4db5e5      cyan_tint       #93e5e5
#   gray_mid        #4d4d4d      gray_lt         #a0a0a0
#
# ─── Cross-Hue Blends (reference) ────────────────────────────────────────────
#
#   teal    #2a9d8f    orange  #e8790c    rose    #d64d8a
#   indigo  #5856d6    olive   #8db600    amber   #e6a117
#   slate   #6987c9    peach   #e8916d    violet  #7b68ee
#   aqua    #47c8b0    coral   #f07e6e    sky     #5fb5e8
